<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <!-- Arrow marker - blue -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0EA5E9"/>
    </marker>
    <!-- Arrow marker - emerald -->
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
    <!-- Arrow marker - violet -->
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <!-- Glow filter for title -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle glow for agent boxes -->
    <filter id="box-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gradient for orchestration box -->
    <linearGradient id="orch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D35;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1F3C;stop-opacity:1"/>
    </linearGradient>
    <!-- Gradient for data sources -->
    <linearGradient id="src-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2540;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#091828;stop-opacity:1"/>
    </linearGradient>
    <!-- Violet gradient for approval panel -->
    <linearGradient id="approval-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A0F3C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#12103A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BACKGROUND                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect width="900" height="700" fill="#080F1C"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="350" x2="900" y2="350" stroke="#0EA5E9" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="450" y1="0" x2="450" y2="700" stroke="#0EA5E9" stroke-width="0.3" stroke-opacity="0.08"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITLE                                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700"
        fill="#F0F7FF" filter="url(#glow)" letter-spacing="0.5">
    OrchestrAI — Autonomous Multi-Agent Architecture
  </text>
  <line x1="120" y1="35" x2="780" y2="35" stroke="#0EA5E9" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 1: DATA SOURCES                               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Section label -->
  <text x="450" y="56" text-anchor="middle" font-size="9" fill="#64748B" letter-spacing="2" font-weight="600">DATA SOURCES</text>

  <!-- Outer border for data sources row -->
  <rect x="40" y="60" width="820" height="56" rx="8" fill="#091828" stroke="#1A3A5C" stroke-width="1"/>

  <!-- PostgreSQL -->
  <rect x="62" y="70" width="120" height="36" rx="6" fill="url(#src-grad)" stroke="#1E4976" stroke-width="1"/>
  <text x="122" y="84" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">🐘 PostgreSQL</text>
  <text x="122" y="98" text-anchor="middle" font-size="8" fill="#64748B">Source DB</text>

  <!-- REST API -->
  <rect x="212" y="70" width="120" height="36" rx="6" fill="url(#src-grad)" stroke="#1E4976" stroke-width="1"/>
  <text x="272" y="84" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">⚡ REST API</text>
  <text x="272" y="98" text-anchor="middle" font-size="8" fill="#64748B">HTTP / JSON</text>

  <!-- CSV / S3 -->
  <rect x="362" y="70" width="120" height="36" rx="6" fill="url(#src-grad)" stroke="#1E4976" stroke-width="1"/>
  <text x="422" y="84" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">☁️ CSV / S3</text>
  <text x="422" y="98" text-anchor="middle" font-size="8" fill="#64748B">Object Storage</text>

  <!-- Google Sheets -->
  <rect x="512" y="70" width="120" height="36" rx="6" fill="url(#src-grad)" stroke="#1E4976" stroke-width="1"/>
  <text x="572" y="84" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">📊 Google Sheets</text>
  <text x="572" y="98" text-anchor="middle" font-size="8" fill="#64748B">Spreadsheet API</text>

  <!-- Kafka / Streaming -->
  <rect x="662" y="70" width="120" height="36" rx="6" fill="url(#src-grad)" stroke="#1E4976" stroke-width="1"/>
  <text x="722" y="84" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">📡 Kafka</text>
  <text x="722" y="98" text-anchor="middle" font-size="8" fill="#64748B">Streaming</text>

  <!-- Arrow: Data Sources → Connector Layer -->
  <path d="M 450 116 L 450 134" stroke="#0EA5E9" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-blue)" stroke-opacity="0.8"/>
  <text x="460" y="128" font-size="8" fill="#64748B">raw data</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 2: CONNECTOR LAYER                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="450" y="148" text-anchor="middle" font-size="9" fill="#64748B" letter-spacing="2" font-weight="600">CONNECTOR LAYER</text>

  <rect x="40" y="152" width="820" height="50" rx="8" fill="#091828" stroke="#1A3A5C" stroke-width="1"/>

  <!-- Pipeline Engine -->
  <rect x="180" y="161" width="175" height="32" rx="6" fill="#0F2540" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="267" y="174" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="700">⚙️ Pipeline Engine</text>
  <text x="267" y="186" text-anchor="middle" font-size="8" fill="#64748B">Scheduler · Retry · State</text>

  <!-- Arrow -->
  <path d="M 355 177 L 390 177" stroke="#0EA5E9" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Source Connectors -->
  <rect x="392" y="161" width="175" height="32" rx="6" fill="#0F2540" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="479" y="174" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="700">🔌 Source Connectors</text>
  <text x="479" y="186" text-anchor="middle" font-size="8" fill="#64748B">Adapters · Schema · Transform</text>

  <!-- Arrow: Connector → Orchestration -->
  <path d="M 450 202 L 450 226" stroke="#0EA5E9" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-blue)" stroke-opacity="0.8"/>
  <text x="460" y="217" font-size="8" fill="#64748B">pipeline runs</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 3: MULTI-AGENT ORCHESTRATION (LARGEST)       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="450" y="240" text-anchor="middle" font-size="9" fill="#7C3AED" letter-spacing="2" font-weight="600">MULTI-AGENT ORCHESTRATION · LangGraph</text>

  <!-- Outer orchestration box -->
  <rect x="40" y="244" width="820" height="240" rx="10" fill="url(#orch-grad)" stroke="#7C3AED" stroke-width="1.8"/>

  <!-- TOP ROW: Monitoring → Diagnosis → Fix Writer -->

  <!-- Monitoring Agent -->
  <rect x="70" y="265" width="160" height="62" rx="8" fill="#0F2540" stroke="#1A3A5C" stroke-width="1.2" filter="url(#box-glow)"/>
  <rect x="70" y="265" width="160" height="4" rx="2" fill="#0EA5E9"/>
  <text x="150" y="283" text-anchor="middle" font-size="11" fill="#F0F7FF" font-weight="700">🔍 Monitoring Agent</text>
  <text x="150" y="297" text-anchor="middle" font-size="8.5" fill="#94A3B8">IsolationForest · RandomForest</text>
  <text x="150" y="310" text-anchor="middle" font-size="8" fill="#64748B">Anomaly Detection · Alerting</text>
  <text x="150" y="323" text-anchor="middle" font-size="8" fill="#0EA5E9">z-score · rolling avg</text>

  <!-- Arrow: Monitoring → Diagnosis -->
  <path d="M 230 296 L 285 296" stroke="#0EA5E9" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Diagnosis Agent -->
  <rect x="287" y="265" width="160" height="62" rx="8" fill="#0F2540" stroke="#1A3A5C" stroke-width="1.2" filter="url(#box-glow)"/>
  <rect x="287" y="265" width="160" height="4" rx="2" fill="#7C3AED"/>
  <text x="367" y="283" text-anchor="middle" font-size="11" fill="#F0F7FF" font-weight="700">🧠 Diagnosis Agent</text>
  <text x="367" y="297" text-anchor="middle" font-size="8.5" fill="#94A3B8">LLM-Powered (Groq / Llama-3)</text>
  <text x="367" y="310" text-anchor="middle" font-size="8" fill="#64748B">Root Cause Analysis · Context</text>
  <text x="367" y="323" text-anchor="middle" font-size="8" fill="#7C3AED">RAG · Vector Search</text>

  <!-- Arrow: Diagnosis → Fix Writer -->
  <path d="M 447 296 L 502 296" stroke="#7C3AED" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-violet)"/>

  <!-- Fix Writer Agent -->
  <rect x="504" y="265" width="160" height="62" rx="8" fill="#0F2540" stroke="#1A3A5C" stroke-width="1.2" filter="url(#box-glow)"/>
  <rect x="504" y="265" width="160" height="4" rx="2" fill="#7C3AED"/>
  <text x="584" y="283" text-anchor="middle" font-size="11" fill="#F0F7FF" font-weight="700">✏️ Fix Writer Agent</text>
  <text x="584" y="297" text-anchor="middle" font-size="8.5" fill="#94A3B8">LLM Code Generation</text>
  <text x="584" y="310" text-anchor="middle" font-size="8" fill="#64748B">Patch Synthesis · Validation</text>
  <text x="584" y="323" text-anchor="middle" font-size="8" fill="#7C3AED">AST · Sandboxed Exec</text>

  <!-- BOTTOM ROW: Learning ← Deployment ←─ (from Fix Writer) -->

  <!-- Arrow: Fix Writer → down → Deployment -->
  <path d="M 584 327 L 584 360 L 500 360" stroke="#7C3AED" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-violet)"/>

  <!-- Deployment Agent -->
  <rect x="287" y="348" width="160" height="62" rx="8" fill="#0F2540" stroke="#1A3A5C" stroke-width="1.2" filter="url(#box-glow)"/>
  <rect x="287" y="348" width="160" height="4" rx="2" fill="#10B981"/>
  <text x="367" y="366" text-anchor="middle" font-size="11" fill="#F0F7FF" font-weight="700">🚀 Deployment Agent</text>
  <text x="367" y="380" text-anchor="middle" font-size="8.5" fill="#94A3B8">Hot-Reload · Zero Downtime</text>
  <text x="367" y="393" text-anchor="middle" font-size="8" fill="#64748B">Rollout · Canary · Rollback</text>
  <text x="367" y="406" text-anchor="middle" font-size="8" fill="#10B981">Blue/Green · Health Checks</text>

  <!-- Arrow: Deployment → Learning -->
  <path d="M 287 379 L 232 379" stroke="#10B981" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-emerald)"/>

  <!-- Learning Agent -->
  <rect x="70" y="348" width="160" height="62" rx="8" fill="#0F2540" stroke="#1A3A5C" stroke-width="1.2" filter="url(#box-glow)"/>
  <rect x="70" y="348" width="160" height="4" rx="2" fill="#10B981"/>
  <text x="150" y="366" text-anchor="middle" font-size="11" fill="#F0F7FF" font-weight="700">📚 Learning Agent</text>
  <text x="150" y="380" text-anchor="middle" font-size="8.5" fill="#94A3B8">RAG · Vector DB (Chroma)</text>
  <text x="150" y="393" text-anchor="middle" font-size="8" fill="#64748B">Feedback Loop · Embeddings</text>
  <text x="150" y="406" text-anchor="middle" font-size="8" fill="#10B981">Continuous Improvement</text>

  <!-- HEALING LOOP: Learning → (dashed arc) → Monitoring -->
  <path d="M 150 348 L 150 256 L 70 256 L 70 265" stroke="#10B981" stroke-width="1.8"
        fill="none" stroke-dasharray="5,4" marker-end="url(#arrow-emerald)" stroke-opacity="0.7"/>
  <text x="56" y="254" font-size="7.5" fill="#10B981" font-weight="600">healing</text>
  <text x="60" y="263" font-size="7.5" fill="#10B981" font-weight="600">loop</text>

  <!-- HUMAN-IN-THE-LOOP APPROVAL PANEL -->
  <rect x="72" y="423" width="756" height="50" rx="8" fill="url(#approval-grad)" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="450" y="442" text-anchor="middle" font-size="11" fill="#F0F7FF" font-weight="700">✅ HUMAN-IN-THE-LOOP: Approval Panel</text>
  <text x="450" y="458" text-anchor="middle" font-size="9" fill="#94A3B8">[ Approve Fix ] · [ Reject &amp; Escalate ] · [ Auto-Heal (confidence ≥ 0.85) ] · [ View Diff ] · [ Audit Log ]</text>

  <!-- Arrow: Approval → Deployment -->
  <path d="M 367 423 L 367 410" stroke="#7C3AED" stroke-width="1.2"
        fill="none" marker-end="url(#arrow-violet)" stroke-opacity="0.7"/>

  <!-- Arrow: Orchestration → Destinations -->
  <path d="M 450 484 L 450 504" stroke="#10B981" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-emerald)" stroke-opacity="0.8"/>
  <text x="458" y="497" font-size="8" fill="#10B981">healed data</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 4: DESTINATIONS                               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="450" y="520" text-anchor="middle" font-size="9" fill="#64748B" letter-spacing="2" font-weight="600">DESTINATIONS</text>

  <rect x="40" y="524" width="820" height="50" rx="8" fill="#091828" stroke="#1A3A5C" stroke-width="1"/>

  <!-- DuckDB -->
  <rect x="100" y="534" width="155" height="30" rx="6" fill="#0F2540" stroke="#10B981" stroke-width="1"/>
  <text x="177" y="548" text-anchor="middle" font-size="10" fill="#10B981" font-weight="600">🦆 DuckDB Warehouse</text>
  <text x="177" y="560" text-anchor="middle" font-size="7.5" fill="#64748B">Local · Analytical Queries</text>

  <!-- Snowflake -->
  <rect x="375" y="534" width="150" height="30" rx="6" fill="#0F2540" stroke="#10B981" stroke-width="1"/>
  <text x="450" y="548" text-anchor="middle" font-size="10" fill="#10B981" font-weight="600">❄️ Snowflake</text>
  <text x="450" y="560" text-anchor="middle" font-size="7.5" fill="#64748B">Cloud Data Warehouse</text>

  <!-- PostgreSQL dest -->
  <rect x="645" y="534" width="155" height="30" rx="6" fill="#0F2540" stroke="#10B981" stroke-width="1"/>
  <text x="722" y="548" text-anchor="middle" font-size="10" fill="#10B981" font-weight="600">🐘 PostgreSQL Dest.</text>
  <text x="722" y="560" text-anchor="middle" font-size="7.5" fill="#64748B">Relational · OLTP</text>

  <!-- Arrow: Destinations → Analytics -->
  <path d="M 450 574 L 450 592" stroke="#0EA5E9" stroke-width="1.5"
        fill="none" marker-end="url(#arrow-blue)" stroke-opacity="0.8"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 5: ANALYTICS LAYER                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="450" y="606" text-anchor="middle" font-size="9" fill="#64748B" letter-spacing="2" font-weight="600">ANALYTICS LAYER</text>

  <rect x="40" y="610" width="820" height="50" rx="8" fill="#091828" stroke="#1A3A5C" stroke-width="1"/>

  <!-- AI Analyst -->
  <rect x="70" y="620" width="185" height="30" rx="6" fill="#0F2540" stroke="#0EA5E9" stroke-width="1"/>
  <text x="162" y="634" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">💬 AI Analyst (NL→SQL)</text>
  <text x="162" y="646" text-anchor="middle" font-size="7.5" fill="#64748B">Natural Language Queries</text>

  <!-- dbt Assistant -->
  <rect x="358" y="620" width="185" height="30" rx="6" fill="#0F2540" stroke="#0EA5E9" stroke-width="1"/>
  <text x="450" y="634" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">🔧 dbt Assistant</text>
  <text x="450" y="646" text-anchor="middle" font-size="7.5" fill="#64748B">Model Gen · Docs · Tests</text>

  <!-- Lineage -->
  <rect x="646" y="620" width="185" height="30" rx="6" fill="#0F2540" stroke="#0EA5E9" stroke-width="1"/>
  <text x="738" y="634" text-anchor="middle" font-size="10" fill="#0EA5E9" font-weight="600">🗂️ Data Lineage</text>
  <text x="738" y="646" text-anchor="middle" font-size="7.5" fill="#64748B">Graph · Impact Analysis</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FOOTER                                                -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="40" y1="672" x2="860" y2="672" stroke="#1A3A5C" stroke-width="0.8"/>
  <text x="450" y="686" text-anchor="middle" font-size="9" fill="#475569" letter-spacing="0.5">
    IsolationForest + RandomForest ML  ·  LangGraph Orchestration  ·  Groq LLM (Llama-3)  ·  Chroma Vector DB  ·  FastAPI Backend
  </text>

</svg>
