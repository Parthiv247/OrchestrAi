<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OrchestrAI — Autonomous Multi-Agent Platform">
  <title>OrchestrAI</title>
  <desc>OrchestrAI horizontal lockup: compass-ring agent mark with a self-healing emerald arc, plus wordmark and tagline on navy.</desc>
  <defs>
    <!-- Background -->
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2039"/>
      <stop offset="1" stop-color="#0B1E35"/>
    </linearGradient>
    <!-- Dot grid texture -->
    <pattern id="pDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F0F7FF" fill-opacity="0.045"/>
    </pattern>
    <!-- Ambient halo behind the mark -->
    <radialGradient id="gHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#7C3AED" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0B1E35" stop-opacity="0"/>
    </radialGradient>
    <!-- Primary mark gradient (user space, local to the mark group's coordinates) -->
    <linearGradient id="gMark" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="102" y2="102">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#4F7DF3"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Healing arc gradient -->
    <linearGradient id="gHeal" gradientUnits="userSpaceOnUse" x1="86" y1="16" x2="104" y2="34">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <!-- Wordmark "AI" gradient -->
    <linearGradient id="gAI" gradientUnits="userSpaceOnUse" x1="465" y1="0" x2="625" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Glows -->
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="800" height="200" rx="20" fill="url(#gBg)"/>
  <rect x="0" y="0" width="800" height="200" rx="20" fill="url(#pDots)"/>
  <rect x="0.75" y="0.75" width="798.5" height="198.5" rx="19.25" fill="none" stroke="#F0F7FF" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Halo behind mark -->
  <circle cx="112" cy="100" r="95" fill="url(#gHalo)"/>

  <!-- ===== The Compass Ring mark (drawn in a 120-unit box, centered at 60,60) ===== -->
  <g transform="translate(52,40)">
    <!-- Orbital ring: the O, broken top-right -->
    <path d="M 77.10 13.02 A 50 50 0 1 0 106.98 42.90"
          fill="none" stroke="url(#gMark)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Self-healing arc bridging the break -->
    <path d="M 88.68 19.04 A 50 50 0 0 1 100.96 31.32"
          fill="none" stroke="url(#gHeal)" stroke-width="5.5" stroke-linecap="round" filter="url(#fGlowSoft)"/>

    <!-- Faint agent mesh -->
    <path d="M 90 60 L 75 34.02 L 45 34.02 L 30 60 L 45 85.98 L 75 85.98 Z"
          fill="none" stroke="url(#gMark)" stroke-width="1.5" stroke-opacity="0.22" stroke-linejoin="round"/>

    <!-- Spokes -->
    <g stroke="url(#gMark)" stroke-width="3" stroke-linecap="round">
      <line x1="73.50" y1="60"    x2="83.00" y2="60"/>
      <line x1="66.75" y1="48.31" x2="71.50" y2="40.08"/>
      <line x1="53.25" y1="48.31" x2="48.50" y2="40.08"/>
      <line x1="46.50" y1="60"    x2="37.00" y2="60"/>
      <line x1="53.25" y1="71.69" x2="48.50" y2="79.92"/>
      <line x1="66.75" y1="71.69" x2="71.50" y2="79.92"/>
    </g>

    <!-- Hub -->
    <circle cx="60" cy="60" r="10" fill="none" stroke="url(#gMark)" stroke-width="4"/>
    <circle cx="60" cy="60" r="2.4" fill="#F0F7FF"/>

    <!-- Agent nodes -->
    <g fill="url(#gMark)">
      <circle cx="90" cy="60"    r="5.5"/>
      <circle cx="45" cy="34.02" r="5.5"/>
      <circle cx="30" cy="60"    r="5.5"/>
      <circle cx="45" cy="85.98" r="5.5"/>
      <circle cx="75" cy="85.98" r="5.5"/>
    </g>
    <circle cx="75" cy="34.02" r="6" fill="#10B981" filter="url(#fGlow)"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="208" y="108"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1"
        fill="#F0F7FF">Orchest<tspan fill="#0EA5E9">r</tspan><tspan fill="url(#gAI)">AI</tspan></text>

  <!-- Tagline with live-status pulse -->
  <circle cx="213" cy="141" r="3.2" fill="#10B981" filter="url(#fGlow)"/>
  <text x="226" y="146"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="13" font-weight="500" letter-spacing="3.2"
        fill="#3D5C7A">AUTONOMOUS MULTI-AGENT PLATFORM</text>
</svg>
