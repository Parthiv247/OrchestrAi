[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ignore rules that are stylistic/opinionated and would require
# mass rewrites of working code without improving correctness.
ignore = [
    "E501",      # line too long (also ignored in CI)
    "BLE001",    # blind exception catch — intentional in agent error handling
    "S110",      # try-except-pass — intentional fallback pattern
    "DTZ003",    # datetime.utcnow() — acceptable for internal timestamps
    "PLW1508",   # invalid envvar default type — int() wraps are intentional
    "RUF013",    # implicit optional — style preference
    "F841",      # unused variable — some are intentional (e.g. _ unpacking)
    "B008",      # function call in default argument — used for FastAPI Depends
    "SIM117",    # multiple with statements — readability preference
    "RUF012",    # mutable class default — acceptable in dataclass-like patterns
    "ASYNC210",  # blocking HTTP in async — known, will refactor later
    "PLW1510",   # subprocess without check — intentional
    "ASYNC230",  # blocking open in async — known
    "ASYNC221",  # run process in async — known
    "C408",      # unnecessary dict/list/tuple call
    "E722",      # bare except — intentional catch-all
    "ISC004",    # implicit string concat in collection
    "PIE810",    # multiple starts/endswith
    "B006",      # mutable argument default
    "SIM103",    # needless bool
    "B005",      # strip with multi-characters
    "F401",      # unused import (caught by separate mypy pass)
    "RUF059",    # unused unpacked variable
    "B018",      # useless expression
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S", "BLE001", "F841"]
